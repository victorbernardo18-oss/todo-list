<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto de controle financeiro pessoal feito com HTML, CSS e JavaScript.">
    <title>Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="hero">
            <p class="eyebrow">Projeto em desenvolvimento</p>
            <h1>Controle Financeiro Pessoal</h1>
            <p class="hero-text">
                Organize entradas, saidas e acompanhe seu saldo em um painel simples e objetivo.
            </p>
        </header>

        <section class="content">
            <article class="card">
                <h2>Resumo</h2>
                <div class="summary-grid">
                    <div class="summary-box">
                        <span>Entradas</span>
                        <strong id="total-entradas">R$ 0,00</strong>
                    </div>
                    <div class="summary-box">
                        <span>Saidas</span>
                        <strong id="total-saidas">R$ 0,00</strong>
                    </div>
                    <div class="summary-box">
                        <span>Saldo</span>
                        <strong id="saldo-total">R$ 0,00</strong>
                    </div>
                </div>
            </article>

            <article class="card">
                <h2>Nova transacao</h2>
                <form id="form-transacao">
                    <input type="text" id="descricao" placeholder="Descricao">
                    <input type="number" id="valor" placeholder="Valor" step="0.01">
                    <select id="tipo">
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saida</option>
                    </select>
                    <button type="submit">Adicionar</button>
                </form>
            </article>

            <article class="card">
                <h2>Transacoes</h2>
                <ul id="lista-transacoes" class="transaction-list"></ul>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
