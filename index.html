<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <meta name="theme-color" content="#1d6f5f">
    <meta name="description" content="Aplicativo de lista de tarefas com prioridades, busca e instalacao no navegador.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <section class="hero-card">
            <p class="eyebrow">Organizacao pessoal</p>
            <h1>Lista de tarefas com foco no que importa</h1>
            <p class="hero-text">
                Organize o dia, acompanhe prioridades e mantenha tudo salvo no navegador.
            </p>
            <div class="hero-stats">
                <article class="stat-box">
                    <span class="stat-label">Total</span>
                    <strong id="stat-total">0</strong>
                </article>
                <article class="stat-box">
                    <span class="stat-label">Pendentes</span>
                    <strong id="stat-pendentes">0</strong>
                </article>
                <article class="stat-box">
                    <span class="stat-label">Concluidas</span>
                    <strong id="stat-concluidas">0</strong>
                </article>
            </div>
        </section>

        <section class="todo-card">
            <header class="card-header">
                <div>
                    <p class="section-label">Painel</p>
                    <h2>Minhas tarefas</h2>
                </div>
                <div class="header-actions">
                    <button id="instalar-app" class="ghost-button" type="button" hidden>
                        Instalar app
                    </button>
                    <button id="limpar-concluidas" class="ghost-button" type="button">
                        Limpar concluidas
                    </button>
                </div>
            </header>

            <form id="form-tarefa" class="task-form">
                <label class="sr-only" for="tarefa">Descricao da tarefa</label>
                <input id="tarefa" name="tarefa" type="text" maxlength="80" placeholder="Ex: revisar projeto do portfolio">

                <label class="sr-only" for="prioridade">Prioridade</label>
                <select id="prioridade" name="prioridade">
                    <option value="baixa">Baixa prioridade</option>
                    <option value="media" selected>Media prioridade</option>
                    <option value="alta">Alta prioridade</option>
                </select>

                <button id="botao" type="submit">Adicionar</button>
            </form>

            <section class="toolbar" aria-label="Ferramentas da lista">
                <div class="search-box">
                    <label class="sr-only" for="busca">Buscar tarefa</label>
                    <input id="busca" type="text" placeholder="Buscar tarefa">
                </div>

                <div class="filters" role="group" aria-label="Filtrar tarefas">
                    <button class="filter-button active" id="todas" type="button" data-filter="todas">Todas</button>
                    <button class="filter-button" id="pendentes" type="button" data-filter="pendentes">Pendentes</button>
                    <button class="filter-button" id="concluidas" type="button" data-filter="concluidas">Concluidas</button>
                </div>
            </section>

            <p id="contador" class="counter"></p>
            <p id="status-app" class="app-status" aria-live="polite"></p>
            <ul id="lista" class="task-list" aria-live="polite"></ul>
        </section>
    </main>

    <template id="template-tarefa">
        <li class="task-item">
            <button class="task-toggle" type="button" aria-label="Marcar tarefa"></button>
            <div class="task-content">
                <div class="task-main-row">
                    <span class="task-text"></span>
                    <span class="task-priority"></span>
                </div>
                <p class="task-meta"></p>
            </div>
            <div class="task-actions">
                <button class="icon-button edit-button" type="button">Editar</button>
                <button class="icon-button delete-button" type="button">Remover</button>
            </div>
        </li>
    </template>

    <script src="script.js"></script>
</body>
</html>
